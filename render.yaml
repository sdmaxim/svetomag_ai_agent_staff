# Render Blueprint: Render reads this file and creates the web service by itself.
# Dashboard -> New -> Blueprint -> pick this repository -> fill in OPENAI_API_KEY -> Apply.
services:
  - type: web
    name: svetomag_ai_agent_staff
    runtime: python
    plan: free                      # sleeps after 15 min idle; files written at runtime are lost on restart
    buildCommand: pip install -r requirements.txt && python build_catalog.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true                # every git push to main redeploys
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10              # crewai needs Python < 3.14
      - key: PYTHONIOENCODING
        value: utf-8
      - key: OPENAI_API_KEY
        sync: false                 # secret: Render asks for it during setup, it is never in git
      - key: ADMIN_TOKEN
        generateValue: true         # random admin password; read it under Environment in the dashboard
      - key: RATE_LIMIT_PER_IP
        value: "20"                 # messages per visitor per 10 minutes
      - key: DAILY_MESSAGE_LIMIT
        value: "300"                # messages per day for everybody (~$0.30/day at gpt-4o-mini prices)
